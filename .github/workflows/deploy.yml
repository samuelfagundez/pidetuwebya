name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Dominio propio (pidetuwebya.es) conectado vía public/CNAME: el
          # sitio vive en la raíz, no en /<repo>/, así que no se sobreescribe
          # VITE_BASE (vite.config.ts ya usa "/" por defecto).
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          # URL del Worker de Cloudflare que envía los correos (ver
          # worker/mailer.js) — no es secreta, el propio Worker filtra por
          # dominio, pero va por variable para no tocar código si cambia.
          VITE_MAILER_URL: ${{ vars.VITE_MAILER_URL }}
        run: npm run build

      # Fallback para rutas desconocidas en GitHub Pages (SPA)
      - name: Copy 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
